name: VoiceAgent
options:
  bundleIdPrefix: com.mouhamadmamane
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3MK9V84J42
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  VoiceAgentKit:
    path: ..
targets:
  # Device app (production). Links Kokoro TTS (MLX), which cannot link for or run in the Simulator.
  VoiceAgent:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppEntry
        type: syncedFolder
      - path: UI
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: VoiceAgentKit
        product: VoiceAgentKit
      - package: VoiceAgentKit
        product: KokoroTTS
    entitlements:
      path: AppEntry/VoiceAgent.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
    info:
      path: AppEntry/Info.plist
      properties:
        CFBundleDisplayName: Voice Agent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64, iphone-performance-gaming-tier]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Voice Agent listens while you talk to it so it can understand your request. Speech is processed on this iPhone and never uploaded.
        NSContactsUsageDescription: Voice Agent looks up the people you ask it to call or message. Your contacts stay on this iPhone.
        NSCalendarsFullAccessUsageDescription: Voice Agent reads and updates the events you ask about. Your calendar stays on this iPhone.
        NSRemindersFullAccessUsageDescription: Voice Agent creates the reminders you ask for. Your reminders stay on this iPhone.
        UIAppFonts: [Fonts/DMSans-Regular.ttf, Fonts/DMSans-Medium.ttf, Fonts/DMSans-SemiBold.ttf, Fonts/DMSans-Bold.ttf]
        LSApplicationQueriesSchemes: [tel, sms, maps, music, message, mailto, calshow, itms-apps, shortcuts]
        UIFileSharingEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent
        PRODUCT_NAME: VoiceAgent
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOKORO_TTS"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
  # Simulator build for UI development and UI tests. Same sources; no Kokoro (MLX has no
  # simulator support), so speech output is disabled and the UI says so. Never shipped.
  VoiceAgentSim:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppEntry
        type: syncedFolder
      - path: UI
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: VoiceAgentKit
        product: VoiceAgentKit
    settings:
      base:
        INFOPLIST_FILE: AppEntry/Info.plist
        CODE_SIGN_ENTITLEMENTS: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent
        PRODUCT_NAME: VoiceAgent
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGNING_ALLOWED: NO
  VoiceAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../Tests/E2E
        type: syncedFolder
    dependencies:
      - target: VoiceAgentSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent.uitests
        TEST_TARGET_NAME: VoiceAgentSim
        SUPPORTED_PLATFORMS: iphonesimulator
        CODE_SIGNING_ALLOWED: NO
schemes:
  VoiceAgent:
    build:
      targets:
        VoiceAgent: all
    run:
      config: Debug
    archive:
      config: Release
  VoiceAgentSim:
    build:
      targets:
        VoiceAgentSim: all
        VoiceAgentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VoiceAgentUITests]
