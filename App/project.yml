name: VoiceAgent
options:
  bundleIdPrefix: com.mouhamadmamane
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Profile: release
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 3MK9V84J42
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
packages:
  VoiceAgentKit:
    path: ..
targets:
  # Device app (production). Links Kokoro TTS (MLX), which cannot link for or run in the Simulator.
  VoiceAgent:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppEntry
        type: syncedFolder
      - path: UI
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: VoiceAgentKit
        product: VoiceAgentKit
      - package: VoiceAgentKit
        product: KokoroTTS
      - package: VoiceAgentKit
        product: AgentEval
      - target: VoiceAgentShare
        embed: true
    entitlements:
      path: AppEntry/VoiceAgent.entitlements
      properties:
        com.apple.developer.kernel.increased-memory-limit: true
        # The only thing the app and the share extension share.
        com.apple.security.application-groups: [group.com.mouhamadmamane.voiceagent]
    info:
      path: AppEntry/Info.plist
      properties:
        CFBundleDisplayName: Voice Agent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiredDeviceCapabilities: [arm64, iphone-performance-gaming-tier]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Voice Agent listens while you talk to it so it can understand your request. Speech is processed on this iPhone and never uploaded.
        NSContactsUsageDescription: Voice Agent looks up the people you ask it to call or message. Your contacts stay on this iPhone.
        NSCalendarsFullAccessUsageDescription: Voice Agent reads and updates the events you ask about. Your calendar stays on this iPhone.
        NSRemindersFullAccessUsageDescription: Voice Agent creates the reminders you ask for. Your reminders stay on this iPhone.
        UIAppFonts: [DMSans-Regular.ttf, DMSans-Medium.ttf, DMSans-SemiBold.ttf, DMSans-Bold.ttf]
        LSApplicationQueriesSchemes: [tel, sms, maps, music, message, mailto, calshow, itms-apps, shortcuts]
        UIFileSharingEnabled: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent
        PRODUCT_NAME: VoiceAgent
        SUPPORTED_PLATFORMS: iphoneos
        SUPPORTS_MACCATALYST: NO
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOKORO_TTS"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      # Profile = Release optimization + developer launch modes (benchmark, on-device evaluation,
      # voice self-test, design gallery, demo mode). The Release (App Store) build has none.
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOKORO_TTS DEVELOPER_MODES"
        Profile:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) KOKORO_TTS DEVELOPER_MODES"
  # The share sheet. Links ShareInbox and nothing else: an app extension runs under a hard memory
  # limit, so it copies bytes and leaves the reading to the app.
  VoiceAgentShare:
    type: app-extension
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Share
        type: syncedFolder
      # The app's typeface, so the one screen the extension owns is not in a different one.
      - path: Resources/Fonts
    dependencies:
      - package: VoiceAgentKit
        product: ShareInbox
    entitlements:
      path: Share/VoiceAgentShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mouhamadmamane.voiceagent]
    info:
      path: Share/Info.plist
      properties:
        CFBundleDisplayName: Voice Agent
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UIAppFonts: [DMSans-Regular.ttf, DMSans-Medium.ttf, DMSans-SemiBold.ttf, DMSans-Bold.ttf]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsFileWithMaxCount: 4
              NSExtensionActivationSupportsText: true
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent.share
        PRODUCT_NAME: VoiceAgentShare
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "6"
        SKIP_INSTALL: YES
  # Simulator build for UI development and UI tests. Same sources; no Kokoro (MLX has no
  # simulator support), so speech output is disabled and the UI says so. Never shipped.
  VoiceAgentSim:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: AppEntry
        type: syncedFolder
      - path: UI
        type: syncedFolder
      - path: Resources
        type: syncedFolder
    dependencies:
      - package: VoiceAgentKit
        product: VoiceAgentKit
      - package: VoiceAgentKit
        product: AgentEval
      - target: VoiceAgentShare
        embed: true
    entitlements:
      path: AppEntry/VoiceAgentSim.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mouhamadmamane.voiceagent]
    settings:
      base:
        INFOPLIST_FILE: AppEntry/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent
        PRODUCT_NAME: VoiceAgent
        SUPPORTED_PLATFORMS: iphonesimulator
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "6"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        # Ad-hoc signed rather than unsigned. The App Group entitlement is the only thing that lets
        # the share extension and the app see the same container, and an unsigned bundle carries no
        # entitlements at all — so the share path could not be exercised in the simulator.
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        # The simulator app is development-only: demo mode and the gallery are always available.
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEVELOPER_MODES"
  VoiceAgentUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: ../Tests/E2E
        type: syncedFolder
    dependencies:
      - target: VoiceAgentSim
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mouhamadmamane.voiceagent.uitests
        TEST_TARGET_NAME: VoiceAgentSim
        SUPPORTED_PLATFORMS: iphonesimulator
        CODE_SIGNING_ALLOWED: NO
schemes:
  VoiceAgent:
    build:
      targets:
        VoiceAgent: all
    run:
      config: Debug
    profile:
      config: Profile
    archive:
      config: Release
  VoiceAgentSim:
    build:
      targets:
        VoiceAgentSim: all
        VoiceAgentUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [VoiceAgentUITests]
